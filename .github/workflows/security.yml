name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  npm-audit:
    name: npm audit
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  trivy:
    name: Trivy vulnerability scan
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 .

  gitleaks:
    name: Gitleaks secret detection
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose
