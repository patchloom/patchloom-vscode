name: Link checker

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "lychee.toml"
  pull_request:
    paths:
      - "**.md"
      - "lychee.toml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  links:
    name: Check links
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install lychee
        run: brew install lychee 2>/dev/null || true

      - name: Run lychee
        run: lychee --config lychee.toml '**/*.md'
