name: Link checker

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "lychee.toml"
  pull_request:
    paths:
      - "**.md"
      - "lychee.toml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install lychee
        run: brew install lychee 2>/dev/null || true

      - name: Run lychee
        run: lychee --config lychee.toml '**/*.md'
