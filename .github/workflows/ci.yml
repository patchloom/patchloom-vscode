name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

  integration-test:
    needs: build
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch test VS Code to run as background app
        run: bash scripts/hide-test-vscode.sh

      - name: Run VS Code extension tests
        run: npm run test:all

      - name: Run UI tests
        run: npm run test:ui
