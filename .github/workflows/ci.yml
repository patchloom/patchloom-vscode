name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-test:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npm run package

  integration-test:
    needs: [unit-test, build]
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - patchloom-vscode
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension and tests
        run: npm run compile && npm run compile-tests

      - name: Run extension integration tests
        run: npm run test:extension

      - name: Setup UI test VS Code
        run: npx extest setup-tests --code_version max --extensions_dir .vscode-test/extensions

      - name: Patch test VS Code to run as background app
        run: bash scripts/hide-test-vscode.sh

      - name: Run UI tests
        run: npx extest run-tests './out-uitest/test/ui/*.test.js' --extensions_dir .vscode-test/extensions
