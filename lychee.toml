# lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Exclude patchloom GitHub links (private repos return 404 unauthenticated).
# Remove these exclusions once the repos are public.
exclude = [
  "https://github.com/patchloom/",
]

# Accept 429 (rate limited) as valid
accept = [200, 429]

# Timeout per request
timeout = 30

# Max concurrent requests
max_concurrency = 4


